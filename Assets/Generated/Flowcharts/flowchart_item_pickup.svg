<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <defs>
    <style>
      .line { stroke: #111; stroke-width: 3; fill: none; }
      .shape { stroke: #111; stroke-width: 3; fill: #fff; }
      .txt { font-family: Arial, Helvetica, sans-serif; font-size: 26px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 22px; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <text x="700" y="60" class="txt title">Блок-схема 1. Подбор расходуемого предмета</text>

  <ellipse cx="700" cy="130" rx="150" ry="48" class="shape"/>
  <text x="700" y="130" class="txt">Начало</text>

  <line x1="700" y1="178" x2="700" y2="240" class="line" marker-end="url(#arrow)"/>

  <polygon points="520,240 880,240 840,330 480,330" class="shape"/>
  <text x="700" y="285" class="txt">Игрок входит в триггер</text>

  <line x1="700" y1="330" x2="700" y2="390" class="line" marker-end="url(#arrow)"/>

  <polygon points="700,390 860,470 700,550 540,470" class="shape"/>
  <text x="700" y="455" class="txt small">Флаг</text>
  <text x="700" y="485" class="txt small">`_collectOnTrigger`</text>
  <text x="700" y="515" class="txt small">включен?</text>

  <text x="895" y="447" class="txt label">Да</text>
  <text x="500" y="447" class="txt label">Нет</text>

  <line x1="860" y1="470" x2="1060" y2="470" class="line" marker-end="url(#arrow)"/>
  <rect x="1040" y="430" width="250" height="80" rx="6" class="shape"/>
  <text x="1165" y="470" class="txt small">Вызвать `TryCollect`</text>

  <line x1="540" y1="470" x2="330" y2="470" class="line"/>
  <line x1="330" y1="470" x2="330" y2="1620" class="line"/>
  <line x1="330" y1="1620" x2="700" y2="1620" class="line" marker-end="url(#arrow)"/>

  <line x1="1165" y1="510" x2="1165" y2="590" class="line"/>
  <line x1="1165" y1="590" x2="700" y2="590" class="line" marker-end="url(#arrow)"/>

  <polygon points="700,590 900,680 700,770 500,680" class="shape"/>
  <text x="700" y="650" class="txt small">Есть `ITakable`</text>
  <text x="700" y="680" class="txt small">и `interactor`</text>
  <text x="700" y="710" class="txt small">не равен `null`?</text>

  <text x="935" y="655" class="txt label">Да</text>
  <text x="460" y="655" class="txt label">Нет</text>

  <line x1="500" y1="680" x2="220" y2="680" class="line"/>
  <line x1="220" y1="680" x2="220" y2="1620" class="line"/>
  <line x1="220" y1="1620" x2="700" y2="1620" class="line" marker-end="url(#arrow)"/>

  <line x1="700" y1="770" x2="700" y2="840" class="line" marker-end="url(#arrow)"/>

  <polygon points="700,840 930,930 700,1020 470,930" class="shape"/>
  <text x="700" y="900" class="txt small">Interactor принадлежит</text>
  <text x="700" y="930" class="txt small">объекту персонажа?</text>

  <text x="965" y="905" class="txt label">Да</text>
  <text x="430" y="905" class="txt label">Нет</text>

  <line x1="470" y1="930" x2="120" y2="930" class="line"/>
  <line x1="120" y1="930" x2="120" y2="1620" class="line"/>
  <line x1="120" y1="1620" x2="700" y2="1620" class="line" marker-end="url(#arrow)"/>

  <line x1="700" y1="1020" x2="700" y2="1090" class="line" marker-end="url(#arrow)"/>

  <rect x="470" y="1090" width="460" height="120" rx="6" class="shape"/>
  <text x="700" y="1135" class="txt small">Применить полезный эффект:</text>
  <text x="700" y="1170" class="txt small">восстановить здоровье, ману</text>
  <text x="700" y="1200" class="txt small">или выдать монеты</text>

  <line x1="700" y1="1210" x2="700" y2="1280" class="line" marker-end="url(#arrow)"/>

  <rect x="520" y="1280" width="360" height="90" rx="6" class="shape"/>
  <text x="700" y="1325" class="txt">Вызвать `Take()`</text>

  <line x1="700" y1="1370" x2="700" y2="1440" class="line" marker-end="url(#arrow)"/>

  <polygon points="500,1440 900,1440 860,1530 460,1530" class="shape"/>
  <text x="700" y="1485" class="txt">Предмет исчезает со сцены</text>

  <line x1="700" y1="1530" x2="700" y2="1572" class="line" marker-end="url(#arrow)"/>

  <ellipse cx="700" cy="1620" rx="150" ry="48" class="shape"/>
  <text x="700" y="1620" class="txt">Конец</text>
</svg>
